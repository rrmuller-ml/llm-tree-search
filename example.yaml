# Example thought tree (Node.to_dict() format).
# Load with: Node.from_dict(yaml.safe_load(open("example.yaml")))
# The root has no thought and a single proposal whose title is the question.

proposals:
- title: What is 12 * 15?
  node:
    thought: Split the multiplication into easier parts.
    proposals:
    - title: 'Distribute over 15: 12*10 + 12*5'
      value: 0.8
      prob: 0.6
      node:
        thought: 12*10 = 120 and 12*5 = 60.
        proposals:
        - title: 'Sum: 120 + 60'
          value: 0.95
          prob: 1.0
          node:
            thought: 120 + 60 = 180
            answer: true
    - title: 'Double and halve: 6*30'
      value: 0.7
      prob: 0.4
    - title: 'Use tens: 10*15 + 2*15'
      value: 0.85
      prob: 0.5
      node:
        thought: 10*15 = 150 and 2*15 = 30.
        proposals:
        - title: 'Sum: 150 + 30'
          value: 0.9
          node:
            thought: 150 + 30 = 180
            answer: true

