proposals:
- title: What is 17 * 23?
  prob: 0.9998966583657585
  logprob: -0.00010334697435609996
  node:
    thought: 17 * 23 can be computed using the difference of squares formula if we adjust the numbers.
    proposals:
    - title: 'Use difference of squares: (20-3)(20+3) = 20^2 - 3^2'
      prob: 0.9858946277414306
      logprob: -0.014205798506736755
      node:
        thought: 'The difference of squares method looks efficient: 17 is 20-3 and 23 is 20+3.'
        proposals:
        - title: Calculate 20^2
          prob: 0.9997820809066975
          logprob: -0.0002179428411182016
          node:
            thought: 20 squared is 400.
            proposals:
            - title: Calculate 3^2
              prob: 0.9659917420796744
              logprob: -0.034599993377923965
              node:
                thought: 3 squared is 9.
                proposals:
                - title: Subtract 9 from 400
                  prob: 0.9998096071311672
                  logprob: -0.00019041099585592747
                  node:
                    thought: '400 - 9 = 391.

                      <answer>391</answer>'
                    answer: true
            - title: Subtract 3^2 from 400
              prob: 0.033054418856613525
              logprob: -3.409600019454956
        - title: Calculate 3^2
          prob: 0.00013981109171709035
          logprob: -8.875218391418457
    - title: 'Direct multiplication: 17 * 20 + 17 * 3'
      prob: 0.014063029693730134
      logprob: -4.2642059326171875
      node:
        thought: Let's use the difference of squares method as it seems cleaner.
        proposals:
        - title: Calculate 20^2 and 3^2
          prob: 0.9929510433726815
          logprob: -0.007073917891830206
          node:
            thought: 20^2 = 400 and 3^2 = 9. So, 17 * 23 = 400 - 9.
            proposals:
            - title: Subtract 9 from 400
              prob: 0.9999161560271167
              logprob: -8.384748798562214e-05
              node:
                thought: '400 - 9 = 391.

                  <answer>391</answer>'
                answer: true
        - title: Check with direct multiplication
          prob: 0.006690451761516941
          logprob: -5.007073879241943
