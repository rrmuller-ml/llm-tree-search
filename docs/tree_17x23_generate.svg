<svg xmlns="http://www.w3.org/2000/svg" width="760" height="566" viewBox="0 0 760 566" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="12" y="26" font-size="15" font-weight="700" fill="#111827">answer, root = generate("What is 17 * 23?")</text><path d="M25.0 90 V522 H38" fill="none" stroke="#9aa4b2" stroke-width="1.2"/><path d="M51.0 146 V466 H64" fill="none" stroke="#9aa4b2" stroke-width="1.2"/><path d="M155.0 370 V394 H168" fill="none" stroke="#9aa4b2" stroke-width="1.2"/><path d="M129.0 314 V338 H142" fill="none" stroke="#9aa4b2" stroke-width="1.2"/><path d="M103.0 258 V282 H116" fill="none" stroke="#9aa4b2" stroke-width="1.2"/><path d="M77.0 202 V226 H90" fill="none" stroke="#9aa4b2" stroke-width="1.2"/><path d="M51.0 146 V170 H64" fill="none" stroke="#9aa4b2" stroke-width="1.2"/><path d="M25.0 90 V114 H38" fill="none" stroke="#9aa4b2" stroke-width="1.2"/><rect x="12" y="44" width="736" height="46" rx="6" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" /><text x="20" y="63" font-weight="600" fill="#111827">What is 17 * 23?<tspan font-weight="400" fill="#6b7280">  p=1.000</tspan></text><text x="20" y="79" fill="#374151">17 * 23 can be computed using the difference of squares formula if we adjust it, or by simple distribution.</text><rect x="38" y="100" width="710" height="46" rx="6" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" /><text x="46" y="119" font-weight="600" fill="#111827">Use distribution: 17 * (20 + 3)<tspan font-weight="400" fill="#6b7280">  p=0.095</tspan></text><text x="46" y="135" fill="#374151">17 * 23 = 17 * 20 + 17 * 3.</text><rect x="64" y="156" width="684" height="46" rx="6" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" /><text x="72" y="175" font-weight="600" fill="#111827">Calculate 17 * 20<tspan font-weight="400" fill="#6b7280">  p=0.998</tspan></text><text x="72" y="191" fill="#374151">17 * 20 = 340.</text><rect x="90" y="212" width="658" height="46" rx="6" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" /><text x="98" y="231" font-weight="600" fill="#111827">Add result to 17 * 3<tspan font-weight="400" fill="#6b7280">  p=0.267</tspan></text><text x="98" y="247" fill="#374151">17 * 3 = 51.</text><rect x="116" y="268" width="632" height="46" rx="6" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" /><text x="124" y="287" font-weight="600" fill="#111827">Add 340 + 51<tspan font-weight="400" fill="#6b7280">  p=0.986</tspan></text><text x="124" y="303" fill="#374151">340 + 51 = 391.</text><rect x="142" y="324" width="606" height="46" rx="6" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" /><text x="150" y="343" font-weight="600" fill="#111827">Verify with difference of squares method<tspan font-weight="400" fill="#6b7280">  p=0.904</tspan></text><text x="150" y="359" fill="#374151">Let's check: 17 = 20 - 3 and 23 = 20 + 3. So 17 * 23 = 20^2 - 3^2 = 400 - 9 = 391.</text><rect x="168" y="380" width="580" height="62" rx="6" fill="#ecfdf3" stroke="#2f9e5b" stroke-width="1.2" /><text x="176" y="399" font-weight="600" fill="#111827">Confirm final answer<tspan font-weight="400" fill="#6b7280">  p=0.998</tspan></text><text x="176" y="415" fill="#374151">Both methods yield 391. The calculation is correct.</text><text x="176" y="431" fill="#374151">&lt;answer&gt;391&lt;/answer&gt;</text><rect x="64" y="452" width="684" height="46" rx="6" fill="#f7f7f8" stroke="#b8bec8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="72" y="471" font-weight="600" fill="#6b7280">Calculate 17 * 3<tspan font-weight="400" fill="#6b7280">  p=0.002</tspan></text><text x="72" y="487" fill="#9ca3af" font-style="italic">unexplored proposal</text><rect x="38" y="508" width="710" height="46" rx="6" fill="#f7f7f8" stroke="#b8bec8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="46" y="527" font-weight="600" fill="#6b7280">Use difference of squares: (20 - 3) * (20 + 3)<tspan font-weight="400" fill="#6b7280">  p=0.905</tspan></text><text x="46" y="543" fill="#9ca3af" font-style="italic">unexplored proposal</text></svg>